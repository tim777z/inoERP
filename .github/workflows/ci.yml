name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: PHP ${{ matrix.php-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
      fail-fast: false

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: inoerp_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, mbstring, json, gd, xml, curl, zip, bcmath, intl
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i 's/DB_SERVER=.*/DB_SERVER=127.0.0.1/' .env
          sed -i 's/DB_NAME=.*/DB_NAME=inoerp_test/' .env
          sed -i 's/DB_USER=.*/DB_USER=root/' .env
          sed -i 's/DB_PASS=.*/DB_PASS=/' .env

      - name: Run PHP CodeSniffer (PSR-12)
        run: vendor/bin/phpcs --standard=PSR12 inoerp/

      - name: Run PHPStan static analysis
        run: vendor/bin/phpstan analyse inoerp/ --level=5 --no-progress

      - name: Run Psalm static analysis
        run: vendor/bin/psalm --show-info=false

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --testdox --coverage-clover=coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: matrix.php-version == '8.2'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Composer Audit
        run: composer audit --no-dev

      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns
          if grep -r -i "password\|secret\|api_key\|token" --include="*.php" --include="*.inc" inoerp/ | grep -v "test" | grep -v ".env.example" | grep -v "SecurityHelper" | grep -v "sanitize" | grep -v "generateToken" | grep -v "timingSafeEquals" | grep -v "hash_equals" | grep -v "bin2hex" | grep -v "random_bytes" | grep -v "password_hash" | grep -v "password_verify" | grep -v "PASSWORD_" | grep -v "getenv" | grep -v "\$_ENV" | grep -v "\$_SERVER" | grep -v "putenv" | grep -v "define.*PASS" | grep -v "DB_PASS" | grep -v "MAIL_PASSWORD" | grep -v "JWT_SECRET" | grep -v "APP_KEY" | grep -v "SESSION_LIFETIME"; then
            echo "::warning::Potential hardcoded secrets found"
          fi

  lint:
    name: Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix inoerp/ --dry-run --diff

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test, security, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t inoerp:test .

      - name: Test Docker image
        run: |
          docker run --rm inoerp:test php -v
          docker run --rm inoerp:test php -m | grep -E "pdo|mbstring|gd|xml|curl|zip|bcmath|intl"