language: php

php:
  - 8.1
  - 8.2
  - 8.3

services:
  - mysql

env:
  global:
    - APP_ENV=testing
    - DB_SERVER=127.0.0.1
    - DB_NAME=inoerp_test
    - DB_USER=root
    - DB_PASS=

before_install:
  - mysql -e 'CREATE DATABASE IF NOT EXISTS inoerp_test;'
  - composer self-update

install:
  - composer install --no-interaction --prefer-dist --optimize-autoloader

before_script:
  - cp .env.example .env
  - sed -i 's/DB_SERVER=.*/DB_SERVER=127.0.0.1/' .env
  - sed -i 's/DB_NAME=.*/DB_NAME=inoerp_test/' .env
  - sed -i 's/DB_USER=.*/DB_USER=root/' .env
  - sed -i 's/DB_PASS=.*/DB_PASS=/' .env

script:
  - vendor/bin/phpcs --standard=PSR12 inoerp/
  - vendor/bin/phpstan analyse inoerp/ --level=5 --no-progress
  - vendor/bin/psalm --show-info=false
  - vendor/bin/phpunit --testdox

after_script:
  - echo "CI pipeline completed"

notifications:
  email: false